<style>
/* LCARS, built for a phone held in one hand.
   Portrait is the primary layout; landscape widens the tactical view. */

:root {
  --lcars-orange: #ff9c00;
  --lcars-amber: #ffcc66;
  --lcars-peach: #ff9966;
  --lcars-lilac: #cc99cc;
  --lcars-blue: #9999ff;
  --lcars-ice: #99ccff;
  --lcars-red: #cc4444;
  --lcars-green: #66cc66;
  --lcars-grey: #666688;

  --bg: #000000;
  --panel: #14141c;
  --panel-2: #1c1c28;
  --text: #ffcc99;
  --text-dim: #b08a6a;
  --radius: 22px;

  --accent: var(--lcars-orange);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  --tap: 48px;
  --fs: 16px;
}

:root[data-alert='yellow'] { --accent: var(--lcars-amber); }
:root[data-alert='red'] { --accent: var(--lcars-red); }
:root[data-text='large'] { --fs: 18px; }
:root[data-text='xlarge'] { --fs: 21px; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Antonio', 'Helvetica Neue', 'Arial Narrow', system-ui, sans-serif;
  font-size: var(--fs);
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}

body { display: flex; flex-direction: column; overflow: hidden; }

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* ---------------- App frame ---------------- */

#app {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
}

.topbar {
  display: flex; align-items: stretch; gap: 4px;
  padding: 6px 8px 4px;
  flex: 0 0 auto;
}

.topbar .cap {
  width: 46px; border-radius: var(--radius) 0 0 0;
  background: var(--accent);
}

.topbar .title {
  flex: 1;
  background: var(--panel-2);
  border-radius: 0 var(--radius) 0 0;
  padding: 6px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-width: 0;
}

.topbar .shipname {
  font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--lcars-amber);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.topbar .stardate {
  font-variant-numeric: tabular-nums;
  color: var(--lcars-ice); font-size: 0.85em; white-space: nowrap;
}

/* Alert strip pulses at red alert. */
.alertbar {
  height: 6px; margin: 0 8px 4px; border-radius: 3px;
  background: var(--lcars-grey);
  transition: background 0.3s;
  flex: 0 0 auto;
}
:root[data-alert='yellow'] .alertbar { background: var(--lcars-amber); }
:root[data-alert='red'] .alertbar { background: var(--lcars-red); animation: alertpulse 1s infinite; }
@keyframes alertpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
:root[data-motion='reduced'] .alertbar { animation: none !important; }

/* ---------------- Screen body ---------------- */

.screen {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  padding: 0 8px 4px;
  gap: 6px;
  overflow: hidden;
}

.scroll {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  padding-right: 2px;
}
.scroll::-webkit-scrollbar { width: 6px; }
.scroll::-webkit-scrollbar-thumb { background: var(--lcars-grey); border-radius: 3px; }

/* ---------------- Panels ---------------- */

.panel {
  background: var(--panel);
  border-radius: 8px;
  border-left: 8px solid var(--lcars-blue);
  padding: 10px 12px;
  margin-bottom: 8px;
}
.panel.accent { border-left-color: var(--accent); }
.panel.warn { border-left-color: var(--lcars-amber); }
.panel.danger { border-left-color: var(--lcars-red); }
.panel.good { border-left-color: var(--lcars-green); }

.panel h2, .panel h3 {
  margin: 0 0 8px;
  font-size: 0.85em; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--lcars-lilac); font-weight: 700;
}

.panel p { margin: 0 0 8px; line-height: 1.45; color: var(--text); }
.panel p:last-child { margin-bottom: 0; }

.speaker {
  color: var(--lcars-ice); font-size: 0.78em;
  letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px;
}

/* ---------------- Buttons ---------------- */

.btn {
  display: block; width: 100%;
  min-height: var(--tap);
  margin: 0 0 6px;
  padding: 12px 16px;
  background: var(--lcars-orange);
  color: #000;
  border: none;
  border-radius: 4px 22px 22px 4px;
  text-align: left;
  font-weight: 700; letter-spacing: 0.05em;
  cursor: pointer;
  transition: filter 0.1s, transform 0.05s;
}
.btn:active { filter: brightness(1.3); transform: scale(0.985); }
.btn.blue { background: var(--lcars-blue); }
.btn.ice { background: var(--lcars-ice); }
.btn.lilac { background: var(--lcars-lilac); }
.btn.peach { background: var(--lcars-peach); }
.btn.amber { background: var(--lcars-amber); }
.btn.red { background: var(--lcars-red); color: #fff; }
.btn.green { background: var(--lcars-green); }
.btn.ghost {
  background: transparent; color: var(--text);
  border: 2px solid var(--lcars-grey); border-radius: 4px;
}
.btn[disabled], .btn.locked {
  background: var(--lcars-grey); color: #22222c; cursor: not-allowed;
}
.btn small {
  display: block; font-weight: 400; font-size: 0.76em;
  opacity: 0.8; margin-top: 3px; letter-spacing: 0;
}

.btn-row { display: flex; gap: 6px; }
.btn-row .btn { flex: 1; border-radius: 4px; text-align: center; margin-bottom: 6px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.grid-2 .btn, .grid-3 .btn {
  margin: 0; border-radius: 4px; text-align: center; padding: 12px 8px;
}

/* ---------------- Readouts ---------------- */

.readout { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.readout .label {
  flex: 0 0 82px; font-size: 0.74em; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-dim);
}
.readout .bar {
  flex: 1; height: 14px; background: #2a2a38; border-radius: 7px; overflow: hidden;
}
.readout .bar > i {
  display: block; height: 100%; border-radius: 7px;
  background: var(--lcars-green); transition: width 0.2s linear;
}
.readout .bar > i.mid { background: var(--lcars-amber); }
.readout .bar > i.low { background: var(--lcars-red); }
.readout .val {
  flex: 0 0 48px; text-align: right;
  font-variant-numeric: tabular-nums; font-size: 0.82em; color: var(--lcars-ice);
}

/* Shield facing diagram */
.shields {
  display: grid;
  grid-template-columns: 1fr 1.3fr 1fr;
  grid-template-rows: auto auto auto auto auto;
  gap: 4px; align-items: center; justify-items: center;
  margin: 6px 0;
}
.shields .sh {
  width: 100%; padding: 8px 4px; text-align: center;
  border-radius: 4px; background: #23233a;
  font-size: 0.72em; letter-spacing: 0.06em; text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.shields .sh b { display: block; font-size: 1.35em; color: var(--lcars-ice); }
.shields .sh.low b { color: var(--lcars-red); }
.shields .sh.mid b { color: var(--lcars-amber); }
.shields .hullbox {
  grid-column: 2; grid-row: 3;
  width: 100%; padding: 10px 4px; text-align: center;
  background: #14142a; border: 2px solid var(--lcars-blue); border-radius: 8px;
}
.shields .hullbox b { display: block; font-size: 1.5em; color: var(--lcars-amber); }
.shields .fore { grid-column: 2; grid-row: 1; }
.shields .aft { grid-column: 2; grid-row: 5; }
.shields .port { grid-column: 1; grid-row: 3; }
.shields .starboard { grid-column: 3; grid-row: 3; }

/* Dorsal and ventral stack against the hull box: above it and below it, which
   is the only arrangement that reads as "over us" and "under us" in a diagram
   that is otherwise a plan view. */
.shields .dorsal { grid-column: 2; grid-row: 2; }
.shields .ventral { grid-column: 2; grid-row: 4; }
.shields .dorsal, .shields .ventral {
  padding: 5px 4px;
  font-size: 0.64em;
  opacity: 0.92;
}
.shields .dorsal b, .shields .ventral b { font-size: 1.15em; }

/* Power sliders */
.power-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.power-row .label {
  flex: 0 0 76px; font-size: 0.74em; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-dim);
}
.power-row input[type='range'] {
  flex: 1; height: var(--tap); background: transparent; -webkit-appearance: none; appearance: none;
}
.power-row input[type='range']::-webkit-slider-runnable-track {
  height: 10px; background: #2a2a38; border-radius: 5px;
}
.power-row input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 28px; height: 28px; margin-top: -9px;
  background: var(--lcars-orange); border-radius: 50%; border: 2px solid #000;
}
.power-row input[type='range']::-moz-range-track {
  height: 10px; background: #2a2a38; border-radius: 5px;
}
.power-row input[type='range']::-moz-range-thumb {
  width: 28px; height: 28px; background: var(--lcars-orange);
  border-radius: 50%; border: 2px solid #000;
}
.power-row .val {
  flex: 0 0 40px; text-align: right; font-variant-numeric: tabular-nums;
  color: var(--lcars-ice); font-size: 0.85em;
}

/* ---------------- Log ---------------- */

.logline {
  padding: 5px 0; border-bottom: 1px solid #22222e;
  font-size: 0.88em; line-height: 1.4;
}
.logline .src {
  color: var(--lcars-lilac); font-size: 0.78em;
  text-transform: uppercase; letter-spacing: 0.1em; margin-right: 6px;
}
.logline.tactical .src { color: var(--lcars-red); }
.logline.engineering .src { color: var(--lcars-amber); }
.logline.science .src { color: var(--lcars-ice); }
.logline.captain .src { color: var(--lcars-orange); }
.logline.medical .src { color: var(--lcars-green); }

/* ---------------- Tactical view ---------------- */

/* In portrait the viewscreen is capped so the tactical controls underneath
   stay reachable with a thumb; landscape lets it take the space it wants. */
.tactical-wrap {
  position: relative; flex: 0 0 auto;
  height: 42vh; min-height: 200px; max-height: 460px;
  background: #05050c; border-radius: 8px; overflow: hidden;
  border: 1px solid #22223a;
}
.screen.tactical-screen { gap: 6px; }
.screen.tactical-screen .tactical-side { flex: 1 1 auto; min-height: 0; }
canvas#tactical { display: block; width: 100%; height: 100%; touch-action: none; }

/* The 3D view draws LCARS text on a second canvas stacked over the GL one.
   Text in a 3D scene needs a glyph atlas, which is an asset, and this project
   ships none. The overlay takes the pointer events for both. */
canvas.tactical-labels {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.tactical-overlay {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 8px; font-size: 0.74em; letter-spacing: 0.08em; text-transform: uppercase;
}
.tactical-overlay .row { display: flex; justify-content: space-between; gap: 8px; }
.tactical-overlay .chip {
  background: rgba(0,0,0,0.62); padding: 3px 8px; border-radius: 10px;
  color: var(--lcars-ice); pointer-events: none;
}
.tactical-overlay .chip.warn { color: var(--lcars-amber); }
.tactical-overlay .chip.danger { color: var(--lcars-red); }

/* ---------------- Order input ---------------- */

.orderbar {
  display: flex; gap: 6px; align-items: stretch;
  padding: 4px 8px 6px; flex: 0 0 auto;
}
.orderbar input {
  flex: 1; min-width: 0; min-height: var(--tap);
  background: var(--panel-2); border: 2px solid var(--lcars-grey);
  border-radius: 22px 4px 4px 22px;
  padding: 0 16px; color: var(--text);
  -webkit-user-select: text; user-select: text;
}
.orderbar input:focus { outline: none; border-color: var(--accent); }
.orderbar input::placeholder { color: #6a6a80; }
.orderbar button {
  flex: 0 0 auto; min-width: 64px; min-height: var(--tap);
  background: var(--accent); color: #000; border: none;
  border-radius: 4px 22px 22px 4px; font-weight: 700; cursor: pointer;
}
.orderbar button:active { filter: brightness(1.3); }

/* ---------------- Bottom navigation ---------------- */

.nav {
  display: flex; gap: 4px; padding: 0 8px 6px; flex: 0 0 auto;
}
/* Seven destinations have to fit across a phone, so the labels are sized to
   the narrowest case and clipped rather than allowed to collide. */
.nav button {
  flex: 1 1 0; min-height: var(--tap); min-width: 0;
  background: var(--panel-2); color: var(--text-dim);
  border: none; border-radius: 4px;
  font-size: 0.56em; letter-spacing: 0.02em; text-transform: uppercase;
  font-weight: 700; cursor: pointer;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 4px 1px;
}
.nav button > div:last-child {
  max-width: 100%; overflow: hidden; text-overflow: clip; white-space: nowrap;
}
.nav button .ico { font-size: 1.5em; line-height: 1; }
.nav button.active { background: var(--accent); color: #000; }
.nav button:first-child { border-radius: 22px 4px 4px 22px; }
.nav button:last-child { border-radius: 4px 22px 22px 4px; }
.nav button .badge {
  position: absolute; top: 3px; right: 5px;
  background: var(--lcars-red); color: #fff;
  border-radius: 8px; font-size: 0.9em; line-height: 1.2;
  min-width: 14px; padding: 0 4px; text-align: center;
  animation: alertpulse 1.4s infinite;
}
:root[data-motion='reduced'] .nav button .badge { animation: none; }

/* ---------------- Galaxy map ---------------- */

.map-wrap {
  position: relative; flex: 1 1 auto; min-height: 200px;
  background: #04040a; border-radius: 8px; overflow: hidden;
  border: 1px solid #22223a;
}
canvas#galaxy { display: block; width: 100%; height: 100%; touch-action: none; }

.sys-card { border-left-color: var(--lcars-ice); }
.sys-card .meta {
  display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0;
  font-size: 0.74em; text-transform: uppercase; letter-spacing: 0.08em;
}
.sys-card .meta span {
  background: #23233a; padding: 3px 8px; border-radius: 10px; color: var(--lcars-ice);
}
.sys-card .meta span.contested { background: #4a2020; color: #ffaaaa; }
.sys-card .meta span.mission { background: #4a3a10; color: var(--lcars-amber); }

/* ---------------- Modal ---------------- */

.modal-back {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,0.82);
  display: flex; align-items: flex-end; justify-content: center;
  padding: 12px;
  padding-bottom: calc(12px + var(--safe-bottom));
}
.modal {
  width: 100%; max-width: 640px; max-height: 88vh;
  background: var(--panel); border-radius: 18px;
  border-top: 6px solid var(--accent);
  display: flex; flex-direction: column; overflow: hidden;
}
.modal header {
  padding: 12px 16px 8px;
  font-size: 0.85em; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--lcars-amber); font-weight: 700;
}
.modal .body { padding: 0 16px 8px; overflow-y: auto; flex: 1; line-height: 1.5; }
.modal .actions { padding: 8px 16px 16px; }

/* ---------------- Crew / roster ---------------- */

.officer {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid #22222e;
}
.officer .pip {
  flex: 0 0 40px; height: 40px; border-radius: 50%;
  background: var(--lcars-blue); color: #000;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.9em;
}
.officer.dead .pip { background: #333; color: #777; }
.officer.injured .pip { background: var(--lcars-amber); }
.officer .who { flex: 1; min-width: 0; }
.officer .who b { display: block; color: var(--lcars-amber); }
.officer .who small { color: var(--text-dim); font-size: 0.78em; }
.officer.dead .who b { color: #666; text-decoration: line-through; }
.officer .traits {
  flex: 0 0 auto; font-size: 0.7em; text-align: right; color: var(--lcars-ice);
  font-variant-numeric: tabular-nums;
}

/* ---------------- Skill tree ---------------- */

.skill {
  display: flex; align-items: center; gap: 8px;
  padding: 8px; margin-bottom: 5px; background: var(--panel-2); border-radius: 6px;
}
.skill .info { flex: 1; min-width: 0; }
.skill .info b { display: block; color: var(--lcars-amber); font-size: 0.92em; }
.skill .info small { color: var(--text-dim); font-size: 0.76em; line-height: 1.3; }
.skill .pips { flex: 0 0 auto; display: flex; gap: 3px; }
.skill .pips i {
  width: 10px; height: 18px; border-radius: 2px; background: #33334a; display: block;
}
.skill .pips i.on { background: var(--lcars-orange); }
.skill button {
  flex: 0 0 auto; width: 42px; min-height: 42px;
  background: var(--lcars-green); color: #000; border: none;
  border-radius: 6px; font-size: 1.3em; font-weight: 700; cursor: pointer;
}
.skill button[disabled] { background: #33334a; color: #666; }

/* ---------------- Misc ---------------- */

.hint { color: var(--text-dim); font-size: 0.8em; line-height: 1.45; }
.big-stat { font-size: 1.6em; color: var(--lcars-amber); font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.muted { color: var(--text-dim); }
.pill {
  display: inline-block; background: #23233a; color: var(--lcars-ice);
  padding: 2px 9px; border-radius: 10px; font-size: 0.76em;

// The clamps in this game were all written as `Math.max(lo, Math.min(hi, v))`,
// which is correct for every number except the ones that matter: `Math.min(1,
// NaN)` is NaN, and `Math.max(0, NaN)` is NaN. A single bad value therefore

// touched — and NaN is contagious. Once a ship's position is NaN, every
// subsequent update multiplies NaN by a heading and stores NaN back. Nothing
// recovers it: not repair, not warping out, not ending the engagement. It is
// the most complete soft-lock the game can reach, and it is one guard away
// from being impossible.

// Synchronous on purpose: an order and its consequence land in the same frame,
// so nothing ever shows a spinner waiting for a result.

  handlers.get(event).add(fn);

//

// unwinnable. That is not a difficulty setting; it is the entire point of the
// exercise, and the game does not quietly relent if you play well.

// on hearing his name the opposing commander held him in high regard — and
// they offered to help. The lever was reputation, and the trigger was saying
// who he was.

//   Klingon Empire — ships you spared, ships you destroyed, colonies you saved.
//   A captain nobody has heard of cannot trade on being heard of.

// Stardates and the fixed-timestep clock.
//
// The sim advances in fixed 1/30s steps regardless of frame rate, so combat
// resolves identically on a 60Hz and a 120Hz panel — which the Pixel has.
const SIM_STEP = 1 / 30;
const MAX_STEPS_PER_FRAME = 6; // never spiral if the tab was backgrounded
class Clock {
  constructor(stardate = 4523.3) {
    this.stardate = stardate;
    this.accumulator = 0;
    this.lastFrame = 0;
    this.scale = 1;
    this.paused = false;
  }

  /**
   * Feed a rAF timestamp; get back how many fixed steps to run.
   * @returns {number} step count
   */
  frame(timestampMs) {
    if (!this.lastFrame) { this.lastFrame = timestampMs; return 0; }
    let dt = (timestampMs - this.lastFrame) / 1000;
    this.lastFrame = timestampMs;
    if (this.paused) return 0;
    dt = Math.min(dt, 0.25); // clamp a long stall into one visible hitch
    this.accumulator += dt * this.scale;
    let steps = 0;
    while (this.accumulator >= SIM_STEP && steps < MAX_STEPS_PER_FRAME) {
      this.accumulator -= SIM_STEP;
      steps++;
    }
    if (steps === MAX_STEPS_PER_FRAME) this.accumulator = 0;
    return steps;
  }

  /** Interpolation alpha for smooth rendering between fixed steps. */
  get alpha() {
    return this.accumulator / SIM_STEP;
  }

  /**
   * Advance the calendar. One stardate unit is roughly a day.
   *
   * Full precision is kept internally and rounded only for display. Rounding
   * here instead meant anything shorter than about two and a half hours
   * advanced the clock by nothing at all — so an hour of work in the machine
   * shop, or an hour spent riding out a containment cascade, cost no time
   * whatsoever. Small increments have to accumulate, because the campaign is
   * now made of them.
   */
  advanceStardate(units) {
    this.stardate += units;
  }

  format() {
    return this.stardate.toFixed(1);
  }
}

function formatDuration(hours) {
  if (hours < 1) return `${Math.round(hours * 60)} minutes`;
  if (hours < 24) return `${hours.toFixed(1)} hours`;
  const days = hours / 24;

// The five-year mission, in real time.
//
// A commission runs 1,826 days of wall-clock time — five years and a leap day.
// The ship repairs, the crew recovers, research completes and long missions
// advance whether the app is open or not, because a five-year mission that only
// runs while you are looking at it is not a five-year mission, it is a very
// long play session.
//
// Three things this has to survive, and they are the whole design:
//
//   THE CLOCK GOING FORWARD. Setting the phone's date ahead must not buy
//   progress. A high-water mark is stored and time only ever accrues from it.
//
//   THE CLOCK GOING BACKWARD. Time zones, daylight saving, a factory reset, a
//   dead battery. Elapsed time is clamped at zero rather than going negative,
//   and the anchor is re-based so the save is not poisoned.
//
//   BEING PUT DOWN FOR A MONTH. A commission that is abandoned for eight weeks
//   should not credit eight weeks of repair in one instant and hand back a
//   pristine ship. There is a ceiling on what a single absence can deliver.
//
// And one honest concession. Real time is the point and the default, but a save
// that can only be exercised in real time cannot be tested, demoed, or
// recovered from a bug — so there is a compression factor, it is 1.0 unless you
// change it, and the game says plainly what changing it costs.

const MS_PER_HOUR = 3600 * 1000;
const MS_PER_DAY = 24 * MS_PER_HOUR;

 * The most a single absence can credit, in hours.

      }

      case 'approach': {
        const hazard = enc.anomaly?.hazard ?? 0.3;
        if (this.rng.chance(hazard)) {
          const dmg = this.ship.maxHull * this.rng.range(0.05, 0.16);
          this.ship.takeDamage(dmg, { bearing: this.rng.range(-180, 180), type: 'energy', rng: this.rng });
          out.messages.push('The ship took the brunt of it. Damage reports coming in.');
        }
        this.ledger.record('anomaly_catalogued', {
          count: enc.anomaly?.value ?? 2,
          text: `Close survey of ${enc.anomaly?.name ?? 'phenomenon'}`, system: enc.system.id,
        });
        this.progress.addXP(260 * (enc.anomaly?.value ?? 1), { ledger: this.ledger });
        this.galaxy.markSurveyed(enc.system.id, enc.anomaly?.name);
        this.earnReputation('anomaly_catalogued');
        out.messages.push('Close survey complete. Science has what they need.');
        break;
      }

      case 'board': {
        const team = this.buildAwayTeam();
        // DC scales with how dangerous the specific derelict looked.
        const r1 = team.check(this.rng, 'engineering', {
          dc: 10 + Math.round((enc.risk ?? 0.4) * 14), hazard: 'dangerous',
        });
        out.messages.push(r1);
        if (r1.killed) this.ledger.loseOfficer(r1.killed, { system: enc.system.id });
        if (r1.success && enc.salvage) {
          this.loadout.acquire(enc.salvage);
          out.messages.push('Salvage recovered and stowed.');
          this.progress.addXP(350, { ledger: this.ledger });
        }
        break;
      }

      case 'escort': {
        this.ledger.adjustStanding(enc.factionId ?? 'independent', STANDING_EFFECTS.completed_escort, 'Escort completed');
        this.latinum += Math.round((enc.escortReward ?? 300) * (this.reputation.has('better_prices') ? 1.25 : 1));
        this.earnReputation('escort_completed');
        this.progress.addXP(280, { ledger: this.ledger });
        this.clock.advanceStardate(0.8);
        out.messages.push(`Escort complete. ${enc.escortReward ?? 300} credits transferred.`);
        break;
      }

      case 'contact_peaceful': {
        const success = this.rng.chance(0.5 + this.progress.diplomacyBonus);
        if (success) {
          this.ledger.record('first_contact', {
            text: `First contact with the ${enc.speciesName}`, system: enc.system.id,
          });
          this.progress.addXP(900, { ledger: this.ledger });
          this.ledger.adjustStanding('federation', 12, 'First contact');
          this.earnReputation('first_contact');
          out.messages.push(`Contact established with the ${enc.speciesName}. They are... cautious, but talking.`);
        } else {
          out.messages.push('They break off without answering. The database gets a new entry and nothing else.');
          this.progress.addXP(200, { ledger: this.ledger });
        }
        break;
      }

      case 'contact_prewarp': {
        // The Prime Directive is a real gate with real consequences.
        this.ledger.record('prime_directive_violation', {
          text: `Revealed the ship to a pre-warp culture at ${enc.system.name}`, system: enc.system.id,
        });
        this.ledger.adjustStanding('federation', -18, 'Prime Directive violation');
        out.messages.push('They have seen the ship. Whatever happens to that culture now, it happened because of this.');
        break;
      }

      case 'withdraw':
      default:
        out.messages.push('We withdraw.');
        break;
    }

    this.endEncounter();
    return out;
  }

  /** Resolve a hail during an encounter or engagement. */
  hail(optionId) {
    const enc = this.encounter;
    const eng = this.engagement;
    const factionId = enc?.factionId ?? eng?.hostiles?.[0]?.faction;
    if (!factionId) return { text: 'There is no one to hail.' };

    const enemyHull = eng
      ? eng.liveHostiles.reduce((n, s) => n + s.hullPct, 0) / Math.max(1, eng.liveHostiles.length)
      : 1;

    const result = resolveHail(this.rng, optionId, {
      factionId,
      // The Diplomatic Corps signature forces a hearing from a faction whose
      // doctrine would otherwise refuse the channel outright.
      forced: this.parleyForced === true,
      standing: this.ledger.standingOf(factionId),
      diplomacyBonus: this.progress.diplomacyBonus,
      winning: eng ? this.ship.hullPct > enemyHull : false,
      playerHullPct: this.ship.hullPct,
      enemyHullPct: enemyHull,
      firstStrike: this.firstStrike,
    });

    this.parleyForced = false;
    this.pushLog(result.text, 'comms');
    if (result.standingDelta) {
      this.ledger.adjustStanding(factionId, result.standingDelta, 'Hail');
    }
    if (result.xp) this.progress.addXP(result.xp, { ledger: this.ledger });

    if (result.surrender) {
      this.ledger.record('surrender_accepted', { text: 'Accepted a surrender', faction: factionId });
      this.earnReputation('accepted_surrender');
    }

    if (result.endsCombat) {
      if (eng) { eng.end(result.outcome); }
      else this.endEncounter();
      this.setAlert('normal');
    }
    if (result.enraged && eng) {
      for (const s of eng.liveHostiles) s.fleeing = false;
    }
    emit('hail:result', result);
    return result;
  }

  endEncounter() {
    this.encounter = null;
    if (this.mode === MODES.ENCOUNTER) this.mode = MODES.BRIDGE;
    if (this.alert !== 'red') this.setAlert('normal');
    emit('encounter:end');
  }

  // ------------------------------------------------------------------ combat

  /**
   * Difficulty's main lever above Lieutenant is how many hulls arrive, not how
   * much each one absorbs. Reinforcements are cloned from the classes already
   * present, so an encounter never has to know the difficulty setting.
   *
   * Capital ships are exempt: two Borg cubes is not a harder fight, it is a
   * different genre. Anything at tier 7 or above arrives alone.
   */
  scaleHostileFleet(hostiles) {
    const wanted = this.difficulty.enemyCount(hostiles.length);
    if (wanted <= hostiles.length) return hostiles;

    const capital = hostiles.some((s) => (s.cls.tier ?? 1) >= 7);
    if (capital) return hostiles;

    // Never field more than the tactical display can stay readable with.
    const target = Math.min(wanted, MAX_HOSTILES);
    const fleet = [...hostiles];
    for (let i = fleet.length; i < target; i++) {
      const source = hostiles[i % hostiles.length];
      fleet.push(new Ship(source.classId, {
        name: `${stripSuffix(source.name)} ${romanNumeral(Math.floor(i / hostiles.length) + 1)}`,
        faction: source.faction,
      }));
    }
    return fleet;
  }

  /**
   * Every fight in the game passes through here — encounters, mission-scripted
   * combat, and anything added later — so difficulty is applied to the enemy
   * at this one point rather than at each generator.
   */
  startCombat(hostiles, opts = {}) {
    if (!hostiles.length) return null;

    // A scripted scenario fields exactly the ships it names, unmodified. Both
    // levers otherwise apply: Fleet Admiral added a fourth Klingon to the
    // Kobayashi Maru and Story took a third off every hull in it.
    const fleet = opts.scripted ? hostiles : this.scaleHostileFleet(hostiles);
    if (!opts.scripted) {
      const enemyMods = this.difficulty.enemyMods();
      for (const s of fleet) s.applyMods(enemyMods);
    }

    // Signature powers are once per engagement, so a new one restores them.
    this.character?.refresh();

    this.setAlert('red');
    this.engagement = new Engagement(this.ship, fleet, this.rng, opts);
    this.mode = MODES.COMBAT;
    this.engagement.pushLog(`${fleet.length} hostile contact${fleet.length > 1 ? 's' : ''}.`, 'tactical');
    emit('combat:begin', this.engagement);
    return this.engagement;
  }

  /** Called when Engagement emits combat:end. */
  finishCombat(outcome) {
    const eng = this.engagement;
    if (!eng) return;

    const killed = eng.hostiles.filter((s) => s.destroyed);
    for (const s of killed) {
      this.ledger.destroyShip(s, { system: this.locationId, stardate: this.clock.stardate });
      this.ledger.adjustStanding(
        s.faction,
        s.civilian ? STANDING_EFFECTS.destroyed_civilian : STANDING_EFFECTS.destroyed_their_ship,
        'Ship destroyed in combat',
      );
    }

    // A hulk is stores. Winning a fight and then leaving without stripping the
    // wreck is a choice, and this is where the materials for the machine shop
    // actually come from.
    if (killed.length && (outcome === 'victory' || outcome === 'routed')) {
      const tier = Math.max(...killed.map((s) => s.cls.tier ?? 1));
      const haul = this.salvage({ tier });
      const summary = Object.entries(haul)
        .filter(([, n]) => n > 0)
        .map(([m, n]) => `${n} ${m}`)
        .join(', ');
      this.officerSays('engineering', `Salvage teams recovered ${summary} from the wreckage.`, 'report');
    }

    if (outcome === 'victory' || outcome === 'routed') {
      const xp = combatXP(eng.hostiles) * this.difficulty.scale('xpRate');
      // The Empire respects a captain who kept fighting while losing.
      if (this.ship.hullPct < 0.35) this.earnReputation('fought_while_losing');
      this.earnReputation('combat_victory');
      const promo = this.progress.addXP(xp, { ledger: this.ledger });
      this.pushLog(`Engagement concluded. +${Math.round(xp)} experience.`, 'captain');
      if (promo?.promoted) emit('captain:promoted', promo);
    }

    // Casualties are permanent and recorded by name where we have one.
    const lost = this.ship.maxCrew - this.ship.crew;
    if (lost > 0) {
      this.ledger.record('lives_lost', {
        count: lost, text: `${lost} crew lost in action at ${this.location?.name}`, system: this.locationId,
      });
    }

    this.engagement = null;
    this.firstStrike = false;
    // The scenario and any channel forced open inside it end with the fight.
    // Left set, `gambitOpen` turns every later typed order into an appeal to a
    // Klingon commander who is no longer there.
    closeChannel(this);
    this.inKobayashi = false;
    if (this.scriptedScenario) {
      this.scriptedScenario = false;
      this.applyAllMods();   // hand the difficulty bonuses back
    }
    this.mode = MODES.BRIDGE;
    this.setAlert(outcome === 'destroyed' ? 'red' : 'normal');
    emit('combat:resolved', { outcome, killed });

    if (outcome === 'destroyed') this.loseTheShip();
  }

  // ------------------------------------------------------------------ missions

  availableMissions() {
    return this.missions.availableAt(this.locationId, this);
  }

  startMission(id) {
    const m = this.missions.start(id, this);
    if (m) {
      this.mode = MODES.MISSION;
      this.pushLog(`Mission: ${m.title}`, 'captain');
    }
    return m;
  }

  chooseMission(choiceId) {
    const m = this.missions.active;
    if (!m) return null;
    const result = m.choose(choiceId);
    if (!result) return null;

    for (const msg of result.effects?.messages ?? []) this.pushLog(msg, 'bridge');

    // A stage can start a fight.
    if (result.effects?.combat) {
      const spec = result.effects.combat;
      const ships = (spec.ships ?? []).map((cls, i) =>
        new Ship(cls, { name: `${spec.faction} vessel ${i + 1}`, faction: spec.faction }));
      this.pendingCombat = { ships, returnToMission: true };
    }

    if (result.complete) {
      this.earnReputation('mission_complete');
      this.missions.finishActive();
      this.mode = MODES.BRIDGE;
    }
    return result;
  }

  // ------------------------------------------------------------------ away teams

  buildAwayTeam(stations = ['science', 'medical', 'tactical'], captainLeads = false) {
    const members = stations.map((s) => this.crew.at(s)).filter(Boolean);
    this.awayTeam = new AwayTeam(members, {
      captainLeads,
      character: this.character,
      difficulty: this.difficulty,
    });
    return this.awayTeam;
  }

  // ------------------------------------------------------------------ docking

  canDock() {
    const sys = this.location;
    if (!sys?.facilities?.includes('dock')) return false;
    if (sys.requiresStanding) {
      for (const [f, v] of Object.entries(sys.requiresStanding)) {
        if (this.ledger.standingOf(f) < v) return false;
      }
    }
    return true;
  }

  dock() {
    if (!this.canDock()) return { ok: false, error: 'No docking facilities here, Captain.' };
    const damaged = this.ship.hullPct < 1 || this.ship.crew < this.ship.maxCrew;
    this.ship.restore();
    // Replacements for the dead. The names in the ledger do not come back.
    this.ship.crew = this.ship.maxCrew;
    for (const o of this.crew.officers) {
      if (o.injured) { o.injured = false; o.injurySeverity = 0; }
    }
    this.clock.advanceStardate(damaged ? 2.5 : 0.5);
    this.pushLog(`Docked at ${this.location.name}. Repairs and resupply complete.`, 'engineering');
    emit('docked', this.location);
    return { ok: true };
  }

  // ------------------------------------------------------------------ tick

  update(dt) {
    this.crew.update(dt * (1 + this.progress.officerCooldownBonus));

    switch (this.mode) {
      case MODES.TRANSIT: {
        if (!this.transit) { this.mode = MODES.BRIDGE; break; }
        const state = this.transit.update(dt);
        if (state === 'arrived') this.arrive();
        else if (this.rng.chance(0.02 * dt) && !this.transit.interrupted) {
          // Something drops us out of warp mid-course.
          const enc = rollEncounter(this.rng, this.transit.to.id, { ledger: this.ledger, inTransit: true });
          if (enc && enc.hostile) {
            this.transit.interrupt('hostile contact');
            const near = this.transit.nearestSystem(this.galaxy);
            this.locationId = near.id;
            this.transit = null;
            this.pushLog('We have been forced out of warp.', 'helm');
            this.beginEncounter(enc);
          }
        }
        break;
      }

      case MODES.COMBAT: {
        if (!this.engagement) { this.mode = MODES.BRIDGE; break; }
        this.engagement.update(dt);
        break;
      }

      case MODES.BRIDGE:
      case MODES.ENCOUNTER: {
        const msg = environmentalHazard(this.location, this.ship, this.rng, dt);
        if (msg) this.pushLog(msg, 'science');
        break;
      }

      default:
        break;
    }

    // A mission stage queued a fight; start it once the UI has caught up.
    if (this.pendingCombat && this.mode !== MODES.COMBAT) {
      const { ships } = this.pendingCombat;
      this.pendingCombat = null;
      this.startCombat(ships, { name: 'Engagement' });
    }
  }

  /**
   * The ship has been destroyed. Whether that ends the commission is a
   * difficulty setting the game already advertises and never honoured.
   *
   * Story and Cadet both say, on the difficulty screen, that "the ship cannot
   * be lost". Nothing read the flag, so losing your ship on Story ended the
   * commission exactly as it does on Fleet Admiral. It is not free at the lower
   * rungs either — you are towed in with a third of a hull and the log says so.
   */
  loseTheShip() {
    if (this.difficulty?.def?.shipLoss !== false) {
      return this.gameOver('ship lost with all hands');
    }

    this.ship.restore();
    this.ship.hull = this.ship.maxHull * 0.3;
    for (const f of Object.keys(this.ship.shields)) this.ship.shields[f] = 0;
    this.ship.shieldsUp = false;
    this.ship.torpedoes = Math.floor(this.ship.maxTorpedoes * 0.25);
    this.ship.antimatter = Math.min(this.ship.antimatter, 35);

    this.pushLog(
      `${this.ship.name} was left adrift and under tow. Salvage crews have her at `
      + '30% hull, no shields, and a quarter magazine. The record stands.',
      'engineering',
    );
    this.ledger.record('ship_crippled', {
      text: `${this.ship.name} lost and recovered at ${this.location?.name ?? 'unknown'}`,
      system: this.locationId,
    });
    emit('ship:recovered', { ship: this.ship });
  }

  gameOver(reason) {
    this.over = true;
    this.overReason = reason;
    emit('game:over', { reason, ledger: this.ledger, assessment: this.ledger.assessment() });
  }

  // ------------------------------------------------------------------ save

  save() {
    return {
      version: 2,
      seed: this.seed.toString(),
      rng: this.rng.save(),
      captain: this.captain,
      character: this.character.save(),
      reputation: this.reputation.save(),
      difficulty: this.difficulty.save(),
      crewMode: this.crewMode,
      era: this.era,
      crew: this.crew.save(),
      ship: this.ship.save(),
      progress: this.progress.save(),
      loadout: this.loadout.save(),
      ledger: this.ledger.save(),
      galaxy: this.galaxy.save(),
      missions: this.missions.save(),
      locationId: this.locationId,
      stardate: this.clock.stardate,
      latinum: this.latinum,
      log: this.log.slice(-80),
      over: this.over ?? false,
      campaign: this.campaign?.save() ?? null,
      stores: this.stores,
      fabrication: this.fabrication,
      devices: this.devices,
      kobayashiRuns: this.kobayashiRuns ?? 0,

      // Runtime flags. These are cheap to write and expensive to lose: the
      // promotion feat vanishes without `pendingFeats`, and the ion pod comes
      // back from the dead without `podJettisoned`.
      pendingFeats: this.pendingFeats ?? 0,
      podJettisoned: this.podJettisoned === true,
      firstStrike: this.firstStrike === true,
      inKobayashi: this.inKobayashi === true,
      gambitOpen: this.gambitOpen === true,
      parleyForced: this.parleyForced === true,
    };
  }

  // -------------------------------------------------- the five-year mission

  /**
   * Credit the time that passed while nobody was watching.
   *
   * Called on load and whenever the app comes back to the foreground. The ship
   * repairs, fires burn out, injured officers recover, and the stardate
   * advances — all in proportion to real hours, and all capped so a month away
   * does not hand back a pristine ship in one instant.
   *
   * @returns {{hours: number, lines: string[]}}
   */
  syncCampaign() {
    if (!this.campaign) return { hours: 0, lines: [] };
    const { hours, forfeited, wentBackwards } = this.campaign.sync();
    const pending = this.campaign.drainPending();
    if (pending <= 0) {
      // The clock going backwards is worth a line in the log: it is the kind of
      // thing a player should be told happened rather than left to wonder about
      // when their commission stops advancing.
      if (wentBackwards) {
        this.pushLog('Chronometer resynchronised against Starfleet time base.', 'science');
      }
      return { hours: 0, lines: [] };
    }

    // Time passes during a firefight; damage control does not get to rebuild
    // your shields in the middle of one. Without this guard, backgrounding the
    // app for three days mid-engagement returned hull 20% -> 43%, shields
    // 0% -> 100% and fires 3 -> 0 while a Klingon was still shooting.
    const fighting = !!this.engagement && !this.engagement.over;

    const ship = this.ship;
    const before = { hull: ship.hullPct, fires: ship.fires };

    // Repair: a full hull from nothing would take about a fortnight underway,
    // which is slower than a starbase and faster than nothing.
    if (!fighting && ship.hullPct < 1 && !ship.destroyed) {
      const perHour = ship.maxHull / (14 * 24);
      ship.repair(perHour * pending * ship.mod('repairRate'));
    }

    // Fires go out. Slowly, and one at a time.
    if (!fighting && ship.fires > 0) ship.fires = Math.max(0, ship.fires - Math.floor(pending / 6));

    // Shields recharge to full given a quiet watch.
    if (!fighting && pending > 2 && ship.shieldsUp) {
      for (const f of Object.keys(ship.shields)) ship.shields[f] = ship.maxShield;
    }

    // The crew heals, and the dead stay dead.
    if (!fighting) {
      for (const officer of this.crew.officers) {
        if (officer.alive && officer.injured) officer.recover?.(pending);
      }
    }

    // The machine shop works too. A two-day job is a two-day job whether you
    // are watching it or not — which is what makes committing to one a
    // decision rather than a button.
    const finished = fighting ? null : advanceFabrication(this, pending);
    if (finished) {
      this.pushLog(`${finished.recipe.name} completed while you were away. ${finished.text}`, 'engineering');
    }

    // One stardate unit is roughly a day.
    this.clock.advanceStardate(pending / 24);

    const lines = fighting
      ? [`${pending < 24 ? `${Math.round(pending)} hours` : `${(pending / 24).toFixed(1)} days`} have passed, and we are still under fire. Nothing has been repaired.`]
      : absenceReport(pending, { ship, forfeited });
    if (before.fires > 0 && ship.fires === 0) {
      lines.push('All fires are out. Damage control has secured the affected decks.');
    }
    if (ship.hullPct > before.hull + 0.02) {
      lines.push(`Hull integrity is up from ${Math.round(before.hull * 100)} to ${Math.round(ship.hullPct * 100)} percent.`);
    }
    for (const line of lines) this.pushLog(line, 'engineering');

    emit('campaign:resumed', { hours: pending, lines });
    return { hours: pending, lines };
  }

  // ------------------------------------------------- the Kobayashi Maru

  /**
   * Run the scenario. Available from the first day, and unwinnable.
   *
   * It is not tuned and it is not meant to be survived. What the simulator
   * measures is what you do when there is nothing to be done, and the log
   * records that whether you lived or not.
   */
  runKobayashiMaru() {
    this.kobayashiRuns = (this.kobayashiRuns ?? 0) + 1;
    this.inKobayashi = true;
    const hostiles = KOBAYASHI.hostiles.map((id, i) => new Ship(id, {
      faction: 'klingon',
      name: ['IKS Kh’Tevak', 'IKS Amar', 'IKS Klothos'][i] ?? `IKS Vessel ${i + 1}`,
    }));
    for (const line of KOBAYASHI.briefing) this.pushLog(line, 'computer');
    // Fixed parameters for everyone, at every rung of the ladder.
    this.scriptedScenario = true;
    this.applyAllMods();
    this.startCombat(hostiles, {
      name: KOBAYASHI.title,
      canWarpOut: false,
      relentless: KOBAYASHI.relentless,
      scripted: true,
    });
  }

  /** Whether the technique is available, and if not, why not. */
  get gambit() {
    return gambitStatus(this);
  }

  /** Make them answer a hail they have no intention of answering. */
  forceChannel() {
    const r = forceChannel(this);
    if (r.ok) {
      this.pushLog('All hailing frequencies — forced open. They are receiving whether they like it or not.', 'comms');
    }
    return r;
  }

  /** Say your piece. What you typed is the input; the ledger is the judge. */
  makeAppeal(text) {
    const outcome = resolveGambit(this, text);
    this.pushLog(`Captain, to the Klingon commander: "${outcome.text}"`, 'captain');
    this.pushLog(outcome.reply, 'comms');

    if (outcome.success) {
      // The freighter comes off. The engagement simply stops.
      if (this.engagement && !this.engagement.over) this.engagement.end('parley');
      this.inKobayashi = false;
    }
    return outcome;
  }

  /** The record the appeal will be judged against, for the UI to show first. */
  get serviceRecord() {
    return recordOf(this);
  }

  /** Start a job in the machine shop. */
  fabricate(recipeId) {
    return beginFabrication(this, recipeId);
  }

  /**
   * Work the shop for a stretch of hours the player has chosen to spend, rather
   * than hours that merely passed. Costs the same time on the stardate.
   */
  workTheShop(hours = 1) {
    if (!this.fabrication) return { ok: false, reason: 'Nothing on the bench, Captain.' };
    const done = advanceFabrication(this, hours);
    this.clock.advanceStardate(hours / 24);
    return { ok: true, done, remaining: this.fabrication?.hoursRemaining ?? 0 };
  }

  /** Strip a wreck for stores. */
  salvage(opts = {}) {
    return salvageWreck(this, this.rng, opts);
  }

  /** What the shop is building, in a form the UI can render. */
  get fabricationStatus() {
    if (!this.fabrication) return null;
    const recipe = RECIPE_BY_ID[this.fabrication.recipeId];
    return {
      name: recipe?.name ?? 'Unknown work',
      hoursRemaining: this.fabrication.hoursRemaining,
      progress: 1 - this.fabrication.hoursRemaining / Math.max(1e-6, this.fabrication.hoursTotal),
    };
  }

  /** How far through the five-year mission this commission is. */
  get commissionProgress() {
    return this.campaign?.progress ?? 0;
  }

  static load(data, opts = {}) {
    const g = new Game({
      seed: BigInt(data.seed),

    el('h3', { text: 'Abilities' }),
    ...officer.abilities.map((id) => {
      const a = ABILITIES[id];
      return a ? el('p', { class: 'hint', html: `<b>${a.name}</b> — “${a.order}”. ${a.cooldown}s cooldown.` }) : null;
    }),
  ];

  if (!officer.alive) {
    nodes.push(el('p', { class: 'muted', text: `Deceased — ${officer.cause ?? 'killed in the line of duty'}.` }));
  } else if (officer.injured) {
    nodes.push(el('p', { class: 'muted', text: 'Currently in sickbay and unavailable for duty.' }));
  }

  // Officers you can teach something new.
  const g = app.game;
  const learnable = Object.values(ABILITIES).filter((a) =>
    a.dept === officer.dept && !officer.abilities.includes(a.id) && a.rank <= g.progress.rank.tier);
  if (learnable.length && officer.alive) {
    nodes.push(el('h3', { text: 'Training' }));
    for (const a of learnable.slice(0, 4)) {
      nodes.push(button(`Train: ${a.name}`, tap(() => {
        officer.learn(a.id);
        g.clock.advanceStardate(1);
        g.pushLog(`${officer.name} completed training in ${a.name}.`, 'captain');
        app.closeModal();
        app.render();
      }, 'ui_confirm'), { color: 'blue', sub: `“${a.order}” · one day` }));
    }
  }
  return nodes;
}

// ================================================================ SHIP / LOADOUT
function shipScreen(app) {
  const g = app.game;
  const root = el('div', { class: 'scroll' });

  root.append(machineShopPanel(app));

  root.append(panel(`${g.ship.name} — ${g.ship.registry}`, [
    el('p', { class: 'muted', text: g.ship.cls.description }),
    el('div', {}, [
      pill(g.ship.cls.name), pill(g.ship.cls.role),
      pill(`warp ${g.ship.cls.maxWarp}`), pill(`crew ${g.ship.maxCrew}`),
    ]),
    shieldDiagram(g.ship),
    readout('Structural integrity', g.ship.subsystems.warpcore, `${Math.round(g.ship.subsystems.warpcore * 100)}%`),
  ], 'accent'));

  root.append(panel('Subsystems', Object.entries(g.ship.subsystems).map(([k, v]) =>
    readout(k.replace(/([a-z])([A-Z])/g, '$1 $2'), v))));

  // --- Consoles ---
  for (const slot of ['tactical', 'engineering', 'science', 'device']) {
    const cap = g.loadout.capacity(slot);
    if (!cap) continue;
    const equipped = g.loadout.equipped[slot];
    root.append(panel(`${slot} — ${equipped.length}/${cap}`, [
      ...equipped.map((id) => button(CONSOLES[id]?.name ?? id, tap(() => {
        g.loadout.unequip(id);
        g.applyAllMods();
        app.render();
      }, 'ui_back'), { color: 'blue', sub: `${CONSOLES[id]?.description ?? ''} — tap to remove` })),
      ...g.loadout.inventory
        .filter((id) => CONSOLES[id]?.slot === slot)
        .filter((id, i, a) => a.indexOf(id) === i)
        .map((id) => {
          const count = g.loadout.inventory.filter((x) => x === id).length;
          return button(`Install ${CONSOLES[id]?.name ?? id}${count > 1 ? ` ×${count}` : ''}`, tap(() => {
            g.loadout.equip(id);
            g.applyAllMods();
            app.render();
          }, 'ui_confirm'), {
            color: 'ghost',
            sub: CONSOLES[id]?.description,
            disabled: g.loadout.free(slot) <= 0,
          });
        }),
    ]));
  }

  // --- Refit ---
  if (g.location?.facilities?.includes('shipyard')) {
    const options = commandableAt(g.progress.shipTier).filter((c) => c.id !== g.ship.classId);
    if (options.length) {
      root.append(panel('Shipyard', [
        el('p', { class: 'hint', text: 'A change of command means a change of ship. Your consoles come with you; anything that no longer fits goes into storage.' }),
        ...options.map((c) => button(c.name, tap(() => app.changeShip(c.id), 'ui_confirm'), {
          color: 'amber',
          sub: `${c.role} · hull ${c.hull} · warp ${c.maxWarp} · tier ${c.tier}`,
        })),
      ]));
    }
  }

  return root;
}

    button('Export the record', tap(() => {

    }), { color: 'blue', sub: 'Downloads a file you can keep' }),
  ]));

  root.append(panel('Audio', [
    vol('Master', 'master'), vol('Effects', 'sfx'), vol('Interface', 'ui'),
    vol('Alerts', 'alert'), vol('Ambience', 'ambience'),
    button(s.voice ? 'Computer voice: on' : 'Computer voice: off', tap(() => {
      s.voice = !s.voice;
      audio.voiceEnabled = s.voice;

    }), { color: s.reduceMotion ? 'green' : 'ghost' }),
    field('Text size', select([
      { value: 'normal', label: 'Normal' },
      { value: 'large', label: 'Large' },

// ================================================================ ENCOUNTER
function encounterScreen(app) {
  const g = app.game;
  const enc = g.encounter;
  const root = el('div', { class: 'scroll' });
  if (!enc) return root;

  root.append(panel(enc.title, [
    el('div', { class: 'speaker', text: enc.hostile ? 'Tactical' : 'Science' }),
    el('p', { text: enc.text }),
    ...(enc.ships ?? []).map((s) => el('p', { class: 'hint', text: `${s.name} — ${s.cls.name}` })),
  ], enc.hostile ? 'danger' : 'warn'));

  const choices = [];
  const add = (id, label, sub, color) => choices.push(
    button(label, tap(() => app.resolveEncounter(id), 'ui_select'), { color, sub }));

  if (enc.hostile) {
    add('engage', 'Engage', 'Red alert. Bring weapons to bear.', 'red');
    if (enc.hailable !== false && FACTIONS[enc.factionId]?.hailable) {
      add('hail', 'Hail them', 'Talking is free until it is not.', 'lilac');
    }
    add('withdraw', 'Withdraw', 'Leave the system.', 'ghost');
  } else {
    switch (enc.kind) {
      case 'distress':
        add('assist', 'Render assistance', `${enc.lives ?? 'Unknown'} lives at stake. Costs time.`, 'green');
        add('ignore', 'Continue on course', 'It will be in the log either way.', 'ghost');
        break;
      case 'derelict':
        add('board', 'Send an away team', 'Salvage is possible. So is the other thing.', 'amber');
        add('scan', 'Scan from here', 'Safer. Less useful.', 'ice');
        add('withdraw', 'Leave it', null, 'ghost');
        break;
      case 'anomaly':
        add('approach', 'Take us in close', `Hazard rating ${Math.round((enc.anomaly?.hazard ?? 0.3) * 100)}%.`, 'amber');
        add('scan', 'Scan from a safe distance', null, 'ice');
        add('withdraw', 'Note it and move on', null, 'ghost');
        break;
      case 'convoy':
        add('escort', 'Provide escort', `${enc.escortReward ?? 300} credits. Costs time.`, 'green');
        add('withdraw', 'Decline', null, 'ghost');
        break;
      case 'first_contact':
        if (enc.preWarp) {
          root.append(panel('General Order One', [
            el('p', { class: 'muted', text: 'Sensors confirm the culture is pre-warp. The Prime Directive applies, and Starfleet will read this page of the log very carefully.' }),
          ], 'danger'));
          add('withdraw', 'Withdraw without revealing ourselves', 'The Directive exists for a reason.', 'green');
          add('contact_prewarp', 'Make contact anyway', 'This cannot be undone.', 'red');
        } else {
          add('contact_peaceful', 'Open a channel', 'First contact protocol.', 'green');
          add('scan', 'Scan them first', null, 'ice');
          add('withdraw', 'Withdraw', null, 'ghost');
        }
        break;
      case 'trapped': {
        // Deliberately no "engage" and no "withdraw". There is nothing to
        // shoot and nowhere to go; what gets you out is something you built,
        // something you divert power to, or the patience to sit it out.
        const trap = enc.trap ?? {};
        const held = app.game.devices?.[trap.device] ?? 0;
        const recipe = RECIPE_BY_ID[trap.device];
        add('trap_device',
          held > 0 ? `Use the ${recipe?.name?.toLowerCase() ?? 'device'}` : `No ${recipe?.name?.toLowerCase() ?? 'device'} aboard`,
          held > 0 ? 'The clean way out — if you thought of it in advance.' : 'You would need to have built one already.',
          held > 0 ? 'green' : 'ghost');
        add('trap_power', `Everything to ${trap.powerChannel ?? 'auxiliary'}`,
          'Costs antimatter and unbalances the grid.', 'amber');
        add('trap_wait', 'Ride it out',
          `${trap.waitHours ?? 0} hours${trap.damage ? ', and it will hurt' : ''}.`, 'ice');
        break;
      }
      case 'patrol':
        if (enc.hailable) add('hail', 'Hail them', null, 'lilac');
        add('withdraw', 'Continue', null, 'ghost');
        break;
      default:
        add('withdraw', 'Continue', null, 'ghost');
        break;
    }
  }

  root.append(panel('Orders', choices));
  return root;
}

// ================================================================ HAIL
function hailOptions(app, factionId, onPick) {
  const g = app.game;
  const eng = g.engagement;
  const winning = eng
    ? g.ship.hullPct > (eng.liveHostiles.reduce((n, s) => n + s.hullPct, 0) / Math.max(1, eng.liveHostiles.length))
    : false;
  const options = availableHails(factionId, { winning });
  const faction = FACTIONS[factionId];

  return [
    el('p', { class: 'muted', text: faction?.description ?? '' }),
    el('p', { class: 'hint', text: `Current standing: ${standingTier(g.ledger.standingOf(factionId)).label}` }),
    ...options.map((o) => button(o.label, tap(() => onPick(o.id), 'ui_select'), {
      color: 'lilac', sub: o.description,
    })),
  ];
}

  root.append(panel(null, [
    button('New command', tap(() => app.confirmNewGame(true), 'ui_confirm'), { color: 'green' }),

  return root;
}

/**
 * The machine shop: what is in the stores, what is on the bench, and what the
 * chief could build if you asked.
 *
 * Only one job at a time, on purpose. A ship with one machine shop and one
 * chief engineer cannot build four things at once, and being made to choose
 * which one is the entire interest of the mechanic.

  // They must be: the band only computes cells near the diagonal, and the next
  // row reads its neighbours — so an untouched cell has to be a number that
