name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and balance tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The project has no dependencies, so there is nothing to install.
      - name: Confirm the project is dependency-free
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies||{}).length + Object.keys(require('./package.json').devDependencies||{}).length")
          if [ "$deps" != "0" ]; then
            echo "::error::package.json declares $deps dependencies; this project is meant to have none"
            exit 1
          fi
          echo "0 dependencies, as intended"

      - name: Run the test suite
        run: node --test tests/*.test.js

  build:
    name: Bundle and offline guarantees
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate icons
        run: node tools/gen-icons.mjs

      - name: Build the single-file bundle
        run: |
          node tools/build-single.mjs
          node tools/build-single.mjs --fragment

      # The headline claim of this project is that it never touches the
      # network. That is worth enforcing rather than trusting.
      - name: Assert the bundle makes no external requests
        run: |
          if grep -oE 'https?://[^"'"'"' )]+' dist/starfleet-command.html \
             | grep -vE 'schemas\.org|w3\.org' | sort -u | grep .; then
            echo "::error::the bundle references an external URL"
            exit 1
          fi
          echo "no external references in the bundle"

      - name: Assert the source fetches nothing
        run: |
          if grep -rnoE '(fetch|XMLHttpRequest|WebSocket|EventSource)\s*\(' src/ | grep .; then
            echo "::error::source performs a network call"
            exit 1
          fi
          echo "no network calls in src/"

      - name: Assert committed build outputs are current
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is stale — run 'npm run build' and commit the result"
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ matches the source"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu-latest image ships the Android SDK; the build script needs
      # build-tools and a platform, which it discovers from ANDROID_HOME.
      - name: Install build-tools and platform
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # The dist/ freshness check in `test` runs the single-file build and diffs
      # the result. It cannot see the APK: nothing rebuilds it there, so the
      # committed binary can drift from the source it is supposed to contain
      # without anything failing. Compare the payload before overwriting it.
      - name: Assert the committed APK carries the current build
        run: |
          node tools/build-single.mjs > /dev/null
          unzip -p dist/starfleet-command.apk assets/game.html > /tmp/apk-game.html
          if ! cmp -s /tmp/apk-game.html dist/starfleet-command.html; then
            echo "::error::the committed APK carries a stale build — rebuild it with tools/build-apk.sh and commit"
            exit 1
          fi
          echo "the committed APK matches the current source"

      - name: Build the APK
        run: ANDROID_HOME="$ANDROID_SDK_ROOT" ./tools/build-apk.sh

      # The app must not be able to reach the network. This asserts it at the
      # manifest level rather than taking the source comment's word for it.
      - name: Assert the APK holds no INTERNET permission
        run: |
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)"
          PERMS="$("${BT%/}/aapt2" dump permissions dist/starfleet-command.apk || true)"
          echo "$PERMS"
          if echo "$PERMS" | grep -q 'android.permission.INTERNET'; then
            echo "::error::the APK requests INTERNET; it is supposed to be incapable of networking"
            exit 1
          fi
          echo "no INTERNET permission, as intended"

      - name: Verify the APK signature
        run: |
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)"
          "${BT%/}/apksigner" verify --verbose dist/starfleet-command.apk

      - uses: actions/upload-artifact@v4
        with:
          name: starfleet-command-apk
          path: dist/starfleet-command.apk
          if-no-files-found: error

  browser:
    name: Browser verification and offline proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright is deliberately not a project dependency, so it is
      # installed here into a scratch prefix and pointed at via NODE_PATH.
      - name: Install Playwright
        run: |
          npm install playwright --prefix /tmp/pw --no-audit --no-fund
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Build the bundle the harness checks
        run: node tools/build-single.mjs

      - name: Drive the real UI, and prove it plays offline
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node tools/verify-app.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

  # Development on this project is autonomous by request of the repository
  # owner, so a pull request that satisfies every check above merges itself
  # rather than waiting for a hand on the button.
  #
  # This lives as a job inside CI rather than a separate `workflow_run`
  # workflow on purpose: `needs` gives an exact "all four went green" gate with
  # no cross-workflow triggering, and no dependence on which branch happens to
  # be the repository default.
  #
  # A merge commit is used rather than a squash so the head branch stays an
  # ancestor of the base and can always be fast-forwarded afterwards.
  automerge:
    name: Merge when green
    needs: [test, build, android, browser]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Take the pull request out of draft and merge it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Drafts cannot be merged; this is a no-op on an already-ready PR.
          gh pr ready "$PR" --repo "$REPO" || true
          gh pr merge "$PR" --repo "$REPO" --merge
          echo "merged #$PR"
